<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="welcome">

        <div class="logo">LIVORA</div>

        <div class="icon">🎟️</div>

        <h1>Bienvenue sur Livora</h1>

        <p>
            Tous vos concerts, spectacles et événements
            au même endroit.
        </p>

<button id="addEventButton">
    + Ajouter mon premier événement
</button>
<form id="eventForm">

    <h2>Ajouter un événement</h2>

    <label for="eventName">Nom de l'événement</label>
    <input type="text" id="eventName" placeholder="Ex : Orelsan">

    <label for="eventDate">Date</label>
    <input type="date" id="eventDate">

    <label for="eventPlace">Lieu</label>
    <input type="text" id="eventPlace" placeholder="Ex : Zénith de Strasbourg">

    <label for="eventCity">Ville</label>
    <input type="text" id="eventCity" placeholder="Ex : Strasbourg">

    <button type="submit">Ajouter l'événement</button>

</form>
    </main>
    
    <script src="script.js"></script>
    
</body>

</html>
